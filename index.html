<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f4">
  <title>Un mensajito para ti</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #59434a;
      background: #fff7f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 12% 18%, #f9dce4 0 2px, transparent 3px),
        radial-gradient(ellipse at 87% 78%, #f9dce4 0 2px, transparent 3px),
        linear-gradient(145deg, #fff8f1, #fcebf0);
    }

    .flower {
      position: fixed;
      z-index: 0;
      font-size: clamp(2.5rem, 8vw, 6rem);
      opacity: 0.38;
      user-select: none;
      animation: sway 5s ease-in-out infinite alternate;
    }

    .flower-one {
      top: 8%;
      left: 8%;
    }

    .flower-two {
      right: 9%;
      bottom: 8%;
      animation-delay: 1.2s;
    }

    .flower-three {
      right: 12%;
      top: 12%;
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      animation-delay: 0.6s;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 490px);
      padding: clamp(28px, 7vw, 48px);
      border: 1px solid #f3d9df;
      border-radius: 28px;
      background: rgb(255 255 255 / 90%);
      box-shadow: 0 22px 65px rgb(124 75 91 / 14%);
      text-align: center;
    }

    .bouquet {
      margin: 0 0 12px;
      font-size: 3.2rem;
      line-height: 1;
    }

    h1 {
      margin: 0;
      color: #a64e68;
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      font-weight: 500;
    }

    .intro {
      margin: 14px 0 26px;
      color: #806b70;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #72545e;
      font-family: Arial, sans-serif;
      font-size: 0.92rem;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #e8cbd3;
      border-radius: 12px;
      outline: none;
      background: #fffafa;
      color: #59434a;
      font: 1rem Arial, sans-serif;
    }

    input:focus {
      border-color: #bf7187;
      box-shadow: 0 0 0 3px rgb(191 113 135 / 15%);
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px 18px;
      border: 0;
      border-radius: 12px;
      background: #ae5e75;
      color: white;
      cursor: pointer;
      font: 600 1rem Arial, sans-serif;
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #96465e;
    }

    button:focus-visible {
      outline: 3px solid #d99aab;
      outline-offset: 3px;
    }

    .message {
      min-height: 136px;
      margin-top: 22px;
      padding: 20px;
      border-radius: 16px;
      background: #fff4f5;
      font-size: 1.1rem;
      line-height: 1.65;
    }

    .message[hidden] {
      display: none;
    }

    .signature {
      margin: 16px 0 0;
      color: #a64e68;
      font-style: italic;
    }

    @keyframes sway {
      from { transform: rotate(-7deg) translateY(0); }
      to { transform: rotate(7deg) translateY(-8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <span class="flower flower-one" aria-hidden="true">🌷</span>
  <span class="flower flower-two" aria-hidden="true">🌼</span>
  <span class="flower flower-three" aria-hidden="true">🌸</span>

  <main>
    <p class="bouquet" aria-hidden="true">💐</p>
    <h1>Un mensajito para ti</h1>
    <p class="intro">A veces las palabras cuestan, pero quiero que sepas que me importas mucho.</p>

    <form id="message-form">
      <label for="name">¿Cómo te llamas?</label>
      <input id="name" name="name" type="text" maxlength="60" placeholder="Escribe tu nombre amor" autocomplete="given-name">
      <button type="submit">Abrir mi mensajito</button>
    </form>

    <section id="message" class="message" aria-live="polite" hidden>
      <p id="greeting"></p>
      <p id="note"></p>
      <p class="signature">¿Podemos hablar cuando te sientas lista? Te voy a escuchar sin interrumpir. 💛</p>
    </section>
  </main>

  <script>
    const messages = [
      "No quiero adivinar qué pasó; prefiero escucharte y entender cómo te sientes.",
      "Me importas mucho. Si hice algo que te molestó, quiero saberlo y hacerme cargo.",
      "No tienes que responder ahora. Cuando quieras hablar, aquí estoy para escucharte.",
      "A veces me cuesta darme cuenta de lo que hice, pero sí quiero entenderte y mejorar.",
      "Tu forma de ver las cosas me importa. Quiero escucharte con calma y sin poner excusas.",
      "No espero que se te pase de inmediato; solo quiero que sepas que estoy aquí para ti.",
      "Gracias por compartir conmigo lo que sientes, incluso cuando es difícil.",
      "Quiero aprender de esto y cuidar mejor lo bonito que tenemos.",
      "No tienes que estar bien para que yo te quiera. Aquí estoy, también en los días complicados.",
      "Me encanta compartir mis días contigo, y quiero que los dos podamos sentirnos escuchados.",
      "Si necesitas un ratito para ti, lo entiendo. Cuando quieras, podemos hablar.",
      "No busco ganar una discusión; quiero entendernos y encontrar una manera de estar bien.",
      "Eres muy especial para mí, y tus sentimientos también lo son.",
      "Quiero demostrarte con acciones que me importas, no solo decírtelo.",
      "Cuando estés lista, me gustaría escucharte y pensar juntos cómo seguir adelante."
    ];

    const form = document.querySelector("#message-form");
    const nameInput = document.querySelector("#name");
    const message = document.querySelector("#message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      document.querySelector("#greeting").textContent = name ? `Hola, ${name} 🌷` : "Hola, amor 🌷";
      document.querySelector("#note").textContent = messages[Math.floor(Math.random() * messages.length)];
      message.hidden = false;
    });
  </script>
</body>
</html>
